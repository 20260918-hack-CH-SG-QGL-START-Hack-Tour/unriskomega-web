services:
  unriskomega-web:
    image: unriskomega-web:${WEB_IMAGE_TAG:-dev}
    build:
      context: .
    environment:
      BACKEND_URL: ${BACKEND_URL:?Set BACKEND_URL in .env}
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NODE_ENV: production
    ports:
      - "${WEB_PORT:-3000}:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
        reservations:
          cpus: "0.25"
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
